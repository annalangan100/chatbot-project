<!DOCTYPE html>
<html>

<head>
    <title>Echo Admin</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='styles.css') }}"
    >
</head>

<body>

    <div class="header">
        <h1>📚 Echo Knowledge Base</h1>
        <p>Add new knowledge for Echo</p>
    </div>

    <div class="chat-container">

        <form method="POST">

            <input
                type="text"
                name="user_input"
                placeholder="User input"
                required
            >

            <input
                type="text"
                name="bot_response"
                placeholder="Bot response"
                required
            >

            <button type="submit">
                Add Response
            </button>

        </form>

    </div>

    <h2>Stored Knowledge</h2>

    <div class="knowledge-list">

        {% for item in knowledge %}

            <div class="knowledge-card">

                <strong>Question:</strong>

                {{ item[1] }}

                <br><br>

                <strong>Answer:</strong>

                {{ item[2] }}

                <br><br>

                <form
                    action="/delete/{{ item[0] }}"
                    method="POST"
                >

                    <button
                        class="delete-button"
                        type="submit"
                    >
                        Delete
                    </button>

                </form>

            </div>

        {% endfor %}

    </div>

</body>

</html>
