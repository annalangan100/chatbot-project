<!DOCTYPE html>
<html>

<head>
    <title>Echo</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='styles.css') }}"
    >
</head>

<body>

    <div class="app-container">

        <div class="header">
            <h1>🤖 Echo</h1>
            <p>Your personal chatbot built with Python and Flask</p>
        </div>

        <div class="chat-container">

            {% if not chat_history %}

                <div class="welcome-message">
                    Start a conversation with Echo.
                </div>

            {% endif %}

            {% for chat in chat_history %}

                <div class="user-message">

                    <div class="user-bubble">
                        {{ chat.user }}
                    </div>

                </div>

                <div class="bot-message">

                    <div class="bot-bubble">
                        {{ chat.bot }}
                    </div>

                </div>

            {% endfor %}

        </div>

        <div class="input-area">

            <form method="POST" class="message-form">

                <input
                    id="message-input"
                    type="text"
                    name="message"
                    placeholder="Type a message..."
                    required
                >

                <button type="submit">
                    Send
                </button>

            </form>

            <form
                action="/clear"
                method="POST"
            >

                <button
                    type="submit"
                    class="clear-button"
                >
                    Clear Chat
                </button>

            </form>

        </div>

        <footer>
            Echo v1.0
        </footer>

    </div>

    <script>

        const chatContainer =
            document.querySelector(".chat-container");

        chatContainer.scrollTop =
            chatContainer.scrollHeight;

        document
            .getElementById("message-input")
            .focus();

    </script>

</body>

</html>
