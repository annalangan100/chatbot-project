<!DOCTYPE html>
<html>
<head>
    <title>My Chatbot</title>
</head>
<body>

    <h1>My Chatbot</h1>

    <form method="POST">

        <input
            type="text"
            name="message"
            placeholder="Type a message"
        >

        <button type="submit">
            Send
        </button>

    </form>

    <hr>

    <p>
        <strong>Bot:</strong>
        {{ response }}
    </p>

</body>
</html>
