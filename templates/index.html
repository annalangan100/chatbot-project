<!DOCTYPE html>
<html>

<head>
    <title>Echo</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='styles.css') }}"
    >
</head>

<body>

    <div class="header">
        <h1>🤖 Echo</h1>
        <p>Your personal chatbot built with Python and Flask</p>
    </div>

    <form action="/clear" method="POST">
        <button type="submit">
            Clear Chat 
        </button>
    </form>
    
    <div class="chat-container">

        {% for chat in chat_history %}

            <div class="user-message">
                <div class="user-bubble">
                    {{ chat.user }}
                </div>
            </div>

            <div class="bot-message">
                <div class="bot-bubble">
                    {{ chat.bot }}
                </div>
            </div>

        {% endfor %}

    </div>

    <form method="POST">

        <input
            type="text"
            name="message"
            placeholder="Type a message..."
            required
        >

        <button type="submit">
            Send
        </button>

    </form>

    <script>

        const chatContainer =
            document.querySelector(".chat-container");

        chatContainer.scrollTop =
            chatContainer.scrollHeight;

    </script>

    <footer>
        Echo v1.0
    </footer>

</body>

</html>
